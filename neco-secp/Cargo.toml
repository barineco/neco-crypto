[package]
name = "neco-secp"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "minimum dependency secp256k1 and Nostr signing core"
repository = "https://github.com/barineco/neco-crypto"
readme = "README.md"
documentation = "https://docs.rs/neco-secp"
keywords = ["secp256k1", "schnorr", "nostr", "crypto"]
categories = ["cryptography"]

[features]
default = ["std", "nostr", "getrandom"]
std = ["alloc", "neco-galois/std", "neco-sha2/std", "neco-base64?/std", "bech32?/std", "serde?/std"]
alloc = []
getrandom = ["dep:getrandom"]
nostr = ["alloc", "dep:neco-json"]
batch = ["alloc"]
nip19 = ["alloc", "dep:bech32"]
nip04 = ["alloc", "dep:aes", "dep:neco-base64", "dep:cbc"]
nip44 = ["alloc", "dep:neco-base64", "dep:chacha20"]
nip17 = ["nostr", "nip44"]
serde = ["alloc", "dep:serde"]

[dependencies]
aes = { version = "0.8", optional = true, default-features = false }
neco-base64 = { path = "../neco-base64", version = "0.2", optional = true, default-features = false, features = ["alloc"] }
bech32 = { version = "0.9", optional = true, default-features = false }
cbc = { version = "0.1", optional = true, default-features = false, features = ["block-padding"] }
chacha20 = { version = "0.9", optional = true, default-features = false }
getrandom = { version = "0.2", optional = true, default-features = false }
neco-galois = { version = "0.2", default-features = false }
neco-sha2 = { path = "../neco-sha2", version = "0.2", default-features = false }
serde = { version = "1", features = ["derive", "alloc"], optional = true, default-features = false }
neco-json = { version = "0.1.3", optional = true, default-features = false }

[lib]
path = "src/lib.rs"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", default-features = false, optional = true, features = ["js"] }
