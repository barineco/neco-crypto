[package]
name = "neco-p256"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "minimum dependency P-256 ECDSA signing core"
repository = "https://github.com/barineco/neco-crypto"
readme = "README.md"
documentation = "https://docs.rs/neco-p256"
keywords = ["p256", "ecdsa", "crypto"]
categories = ["cryptography"]

[features]
default = ["std", "getrandom"]
std = ["alloc", "neco-galois/std", "neco-sha2/std"]
alloc = []
getrandom = ["dep:getrandom"]

[dependencies]
neco-galois = { version = "0.2", default-features = false }
neco-sha2 = { path = "../neco-sha2", version = "0.2", default-features = false }
getrandom = { version = "0.2", default-features = false, optional = true }

[lib]
path = "src/lib.rs"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", default-features = false, optional = true, features = ["js"] }
