[package]
name = "neco-argon2"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "minimum dependency Argon2id password hashing with Blake2b"
repository = "https://github.com/barineco/neco-crypto"
readme = "README.md"
keywords = ["argon2", "argon2id", "password", "hashing", "blake2b"]
categories = ["cryptography"]

[features]
default = ["std", "phc", "getrandom"]
std = ["alloc", "neco-base64?/std"]
alloc = ["zeroize/alloc"]
phc = ["alloc", "dep:neco-base64", "neco-base64/alloc"]
getrandom = ["dep:getrandom"]

[dependencies]
getrandom = { version = "0.3", optional = true, default-features = false }
neco-base64 = { path = "../neco-base64", version = "0.2", optional = true, default-features = false }
zeroize = { version = ">=1.8.2, <1.9", default-features = false }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3", default-features = false, optional = true, features = ["wasm_js"] }
